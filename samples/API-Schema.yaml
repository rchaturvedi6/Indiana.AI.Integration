    # ---------- API 5: Screener Disposition ----------

    DispositionAttachmentUpdate:
      type: object
      required: [index, disposition]
      properties:
        index:
          type: integer
        disposition:
          $ref: '#/components/schemas/Disposition'

    DispositionScreeningUpdate:
      type: object
      required: [index, disposition]
      properties:
        index:
          type: integer
        disposition:
          type: object
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/ScreeningCheckResult'

    DispositionAddressUpdate:
      type: object
      properties:
        index:
          type: integer
        disposition:
          $ref: '#/components/schemas/Disposition'

    ScreenerDispositionRequest:
      type: object
      required: [wfProcessId, trackingId]
      properties:
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/DispositionAddressUpdate'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/DispositionAttachmentUpdate'
        screenings:
          type: array
          items:
            $ref: '#/components/schemas/DispositionScreeningUpdate'
        wfProcessId:
          type: integer
        trackingId:
          type: string

    FailedItem:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string

    ScreenerDispositionResponse:
      type: object
      required: [result]
      properties:
        result:
          type: object
          required: [code, message, failedItems]
          properties:
            code:
              type: string
              example: "1000"
              description: "1000 = success; 3xxx = errors (e.g. 3001 = errors encountered)"
            message:
              type: string
            failedItems:
              type: array
              items:
                $ref: '#/components/schemas/FailedItem'

  examples:
    DispositionSuccess:
      summary: All disposition updates applied
      value:
        result:
          code: "1000"
          message: AI review results applied successfully
          failedItems: []
    DispositionFailed:
      summary: One or more items failed to apply
      value:
        result:
          code: "3001"
          message: Errors were encountered
          failedItems:
            - code: 3003
              message: Task not found or is already completed.